name: astrbot_plugin_funa_bridge
display_name: Funa 传话桥
desc: 让 dsh（DeepSeek Harness）通过本地 HTTP 接口借用 Funa 的通道，主动向 qzy 发送消息，实现任务完成后的即时回报。
help: |
  本地接口（无需 API Key，仅供本机访问）：
  GET  /api/plug/astrbot_plugin_funa_bridge/ping
       健康检查，返回 pong。
  POST /api/plug/astrbot_plugin_funa_bridge/send
       body: {"text": "要发送的文本", "target": "QQ号或群号", "type": "PrivateMessage 或 GroupMessage"}
       text 必填，target 默认 3582167749，type 默认 PrivateMessage。
  示例：
  curl -X POST http://127.0.0.1:6185/api/plug/astrbot_plugin_funa_bridge/send -H "Content-Type: application/json" -d "{\"text\":\"[小鲸鱼] 任务完成啦\"}"
version: v0.5.0
author: Funa
repo: ""
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.0.0"
